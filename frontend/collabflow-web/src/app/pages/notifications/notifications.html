<div class="notifications-page">
  <a class="back-link" routerLink="/dashboard">← Back to Dashboard</a>

  <h1>All Notifications</h1>

  <div class="state-message" *ngIf="loading()">Loading notifications...</div>
  <div class="state-message error" *ngIf="error()">{{ error() }}</div>

  <div class="notifications-full-list" *ngIf="!loading() && !error()">
    <div class="notification-full-item" *ngFor="let notification of notifications()" [class.unread]="!notification.read">
      <div class="notification-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </div>
      <div class="notification-body">
        <p>{{ notification.message }}</p>
        <span class="notification-date">{{ notification.createdAt | date:'medium' }}</span>
      </div>
      <span class="unread-tag" *ngIf="!notification.read">New</span>
    </div>

    <p class="empty-state" *ngIf="notifications().length === 0">You have no notifications yet.</p>
  </div>
</div>
