version: "3.9"
# CollabFlow — local infrastructure
# One Postgres instance per service, matching the database-per-service rule
# in ARCHITECTURE.md. Each service will point at its own DB via its
# application.yml / application.properties once we build it.
services:
  auth-db:
    image: postgres:16-alpine
    container_name: collabflow-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
  user-db:
    image: postgres:16-alpine
    container_name: collabflow-user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
  project-db:
    image: postgres:16-alpine
    container_name: collabflow-project-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: project_pass
    ports:
      - "5434:5432"
    volumes:
      - project_db_data:/var/lib/postgresql/data
  notification-db:
    image: postgres:16-alpine
    container_name: collabflow-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5435:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
  activity-db:
    image: postgres:16-alpine
    container_name: collabflow-activity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: activitydb
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: activity_pass
    ports:
      - "5436:5432"
    volumes:
      - activity_db_data:/var/lib/postgresql/data
  # Kafka in KRaft mode (no Zookeeper needed) — added in Phase 8 for
  # async messaging between project-service and notification-service.
  kafka:
    image: apache/kafka:3.8.0
    container_name: collabflow-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  # Redis — added in Phase 12 to back the gateway's rate limiter.
  redis:
    image: redis:7-alpine
    container_name: collabflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  auth_db_data:
  user_db_data:
  project_db_data:
  notification_db_data:
  activity_db_data: