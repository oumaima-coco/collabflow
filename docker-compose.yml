version: "3.9"

# CollabFlow — local infrastructure
# One Postgres instance per service, matching the database-per-service rule
# in ARCHITECTURE.md. Each service will point at its own DB via its
# application.yml / application.properties once we build it.

services:

  auth-db:
    image: postgres:16-alpine
    container_name: collabflow-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  user-db:
    image: postgres:16-alpine
    container_name: collabflow-user-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data

  project-db:
    image: postgres:16-alpine
    container_name: collabflow-project-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: project_pass
    ports:
      - "5434:5432"
    volumes:
      - project_db_data:/var/lib/postgresql/data

  notification-db:
    image: postgres:16-alpine
    container_name: collabflow-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_pass
    ports:
      - "5435:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  activity-db:
    image: postgres:16-alpine
    container_name: collabflow-activity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: activitydb
      POSTGRES_USER: activity_user
      POSTGRES_PASSWORD: activity_pass
    ports:
      - "5436:5432"
    volumes:
      - activity_db_data:/var/lib/postgresql/data

  # Kafka and its dependencies get added in Phase 8 — deliberately not
  # included yet, since we don't need async messaging until the
  # notification-service phase. No point running infrastructure we
  # aren't using.

volumes:
  auth_db_data:
  user_db_data:
  project_db_data:
  notification_db_data:
  activity_db_data:
