server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/teams/**
            - id: project-service
              uri: lb://PROJECT-SERVICE
              predicates:
                - Path=/projects/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/